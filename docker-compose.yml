services:
  web:
    build: .
    container_name: it-system-web
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput 2>/dev/null; python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - PYTHONUNBUFFERED=1
